name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# A newer push supersedes an older one on the same ref. The default branch is
# exempt, so a deployment is never cancelled half way.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    name: checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Cache Composer packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.0.2
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Setup Application
        run: composer setup

      # Formatting, lint, front-end types, Pint, PHPStan and the test suite.
      - name: Run CI Checks
        run: composer ci:check

  deploy:
    name: deploy
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Nothing here is checked out or built: the server pulls and builds for
    # itself. This only tells it that a green commit is ready.
    steps:
      - name: Trigger the deployment
        env:
          WEBHOOK: ${{ secrets.FORGE_DEPLOY_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "No FORGE_DEPLOY_WEBHOOK secret is set — nothing to deploy to."
            echo "Add the trigger URL from Forge under the site's Deployments tab."
            exit 0
          fi

          echo "Requesting a deployment."
          status=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$WEBHOOK")

          if [ "$status" != "200" ]; then
            echo "The deployment endpoint answered $status."
            exit 1
          fi

          echo "Deployment requested."
