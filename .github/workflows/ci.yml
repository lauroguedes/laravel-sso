name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# A newer push supersedes an older one on the same ref. The default branch is
# exempt, so a deployment is never cancelled half way.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    name: checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Cache Composer packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.0.2
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Setup Application
        run: composer setup

      # Formatting, lint, front-end types, Pint, PHPStan and the test suite.
      - name: Run CI Checks
        run: composer ci:check

  mysql:
    name: tests on MySQL
    runs-on: ubuntu-latest

    # The main job runs on SQLite, which never enforces a column's type. The
    # demo and most production installs run MySQL, where a UUID written to an
    # integer column is an error, so the suite runs there too.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: laravel_sso
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Cache Composer packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.0.2
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Setup Application
        run: composer setup

      - name: Run the test suite on MySQL
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: laravel_sso
          DB_USERNAME: root
          DB_PASSWORD: ''
        run: php artisan test

  deploy:
    name: deploy
    needs: [ci, mysql]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Nothing here is checked out or built: the server pulls and builds for
    # itself. This only tells it that a green commit is ready.
    steps:
      - name: Trigger the deployment
        env:
          WEBHOOK: ${{ secrets.FORGE_DEPLOY_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "No FORGE_DEPLOY_WEBHOOK secret is set, so there is nothing to deploy to."
            echo "Add the deploy hook URL from the site's Deployments settings in Forge."
            exit 0
          fi

          # Forge deploys the site's configured branch. These parameters label
          # the deployment in Forge's history, and forge_deploy_branch makes
          # Forge ignore the request unless it names that branch.
          echo "Requesting a deployment of ${GITHUB_SHA::7}."
          curl -fsS -G -o /dev/null \
            --data-urlencode "forge_deploy_branch=${GITHUB_REF_NAME}" \
            --data-urlencode "forge_deploy_commit=${GITHUB_SHA}" \
            --data-urlencode "forge_deploy_author=${GITHUB_ACTOR}" \
            "$WEBHOOK"
          echo "Deployment requested."
